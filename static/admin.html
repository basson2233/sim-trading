<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin・用戶隱私清除</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css?v=20261026d">
<style>
.admin-box{max-width:520px;margin:40px auto;padding:0 16px}
.admin-box .panel{padding:18px}
.admin-warn{background:rgba(234,57,67,.12);border:1px solid rgba(234,57,67,.35);color:#fecaca;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}
.admin-row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.admin-row label{flex:1;min-width:140px}
.user-card{margin-top:14px;padding:12px;background:#0b0f14;border:1px solid var(--line);border-radius:8px}
.user-card dl{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;margin:0}
.user-card dt{color:var(--muted)}
.user-card dd{margin:0;font-weight:600}
.btn.danger{background:var(--down);border-color:var(--down);color:#fff}
.btn.danger:disabled{opacity:.5}
.key-hint{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body class="auth-page">
<div class="admin-box">
  <div class="panel">
    <h3 style="margin-top:0">Admin・按 ID 刪除用戶</h3>
    <div class="admin-warn">會永久清除該用戶全部數據（持倉、訂單、成交、session、對戰紀錄、帳戶）。Admin Key 只存在你瀏覽器呢次工作階段，唔會寫入程式碼。</div>

    <label>Admin Key
      <input id="adminKey" type="password" autocomplete="off" spellcheck="false" placeholder="貼上 X-Admin-Key">
    </label>
    <p class="key-hint">Key 由負責人私下提供；離開頁面後可撳「清除本機 Key」。</p>
    <div class="admin-row" style="margin-top:10px">
      <button type="button" id="btnSaveKey" class="btn ghost small">暫存到本工作階段</button>
      <button type="button" id="btnClearKey" class="btn ghost small">清除本機 Key</button>
    </div>

    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">

    <div class="admin-row">
      <label>用戶 ID
        <input id="userId" type="number" min="1" step="1" placeholder="例如 42" inputmode="numeric">
      </label>
      <button type="button" id="btnLookup" class="btn primary">查詢</button>
    </div>
    <div id="msg" class="msg"></div>
    <div id="userCard" class="user-card hidden"></div>
    <div class="admin-row" style="margin-top:12px">
      <button type="button" id="btnDelete" class="btn danger big" disabled>確認刪除並清晒數據</button>
    </div>
  </div>
  <p class="muted small-text" style="text-align:center"><a href="/">返回交易平台</a></p>
</div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const KEY_STORE = "sim_admin_key";
let looked = null;

function setMsg(text, err) {
  const el = $("#msg");
  el.textContent = text || "";
  el.className = err ? "msg err" : "msg";
}

function getKey() {
  return ($("#adminKey").value || "").trim() || sessionStorage.getItem(KEY_STORE) || "";
}

function loadKey() {
  const k = sessionStorage.getItem(KEY_STORE) || "";
  if (k) $("#adminKey").value = k;
}

$("#btnSaveKey").onclick = () => {
  const k = ($("#adminKey").value || "").trim();
  if (!k) { setMsg("請先輸入 Admin Key", true); return; }
  sessionStorage.setItem(KEY_STORE, k);
  setMsg("已暫存到本工作階段（sessionStorage）");
};

$("#btnClearKey").onclick = () => {
  sessionStorage.removeItem(KEY_STORE);
  $("#adminKey").value = "";
  setMsg("已清除本機 Key");
};

async function adminFetch(path, opts = {}) {
  const key = getKey();
  if (!key) throw new Error("請先輸入 Admin Key");
  const r = await fetch(path, {
    ...opts,
    headers: {
      ...(opts.headers || {}),
      "X-Admin-Key": key,
      "Accept": "application/json",
    },
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const detail = typeof data.detail === "string" ? data.detail : (r.status === 401 ? "unauthorized" : "請求失敗");
    throw new Error(detail);
  }
  return data;
}

function renderUser(u) {
  looked = u;
  const box = $("#userCard");
  box.classList.remove("hidden");
  const created = u.created_at != null ? new Date(Number(u.created_at) * 1000).toLocaleString("zh-HK") : "—";
  box.innerHTML = `<dl>
    <dt>ID</dt><dd>${u.id}</dd>
    <dt>用戶名</dt><dd>${u.username || "—"}</dd>
    <dt>建立時間</dt><dd>${created}</dd>
    <dt>Google</dt><dd>${u.has_google ? "有" : "無"}</dd>
    <dt>電郵欄</dt><dd>${u.has_email ? "有（內容唔顯示）" : "無"}</dd>
  </dl>`;
  $("#btnDelete").disabled = false;
}

$("#btnLookup").onclick = async () => {
  setMsg("");
  looked = null;
  $("#btnDelete").disabled = true;
  $("#userCard").classList.add("hidden");
  const id = Number($("#userId").value);
  if (!Number.isInteger(id) || id < 1) { setMsg("請輸入有效用戶 ID", true); return; }
  try {
    const u = await adminFetch(`/api/admin/users/${id}`);
    renderUser(u);
    setMsg("查詢成功");
  } catch (e) {
    setMsg(e.message || "查詢失敗", true);
  }
};

$("#btnDelete").onclick = async () => {
  if (!looked) return;
  const ok = confirm(`確定永久刪除用戶 #${looked.id}（${looked.username}）？此操作無法復原。`);
  if (!ok) return;
  const again = prompt(`再輸入用戶 ID ${looked.id} 確認刪除：`);
  if (String(again || "").trim() !== String(looked.id)) {
    setMsg("確認 ID 唔啱，已取消", true);
    return;
  }
  try {
    const res = await adminFetch(`/api/admin/users/${looked.id}`, { method: "DELETE" });
    setMsg(`已刪除 #${res.id}（${res.username}），相關數據已清除`);
    looked = null;
    $("#userCard").classList.add("hidden");
    $("#btnDelete").disabled = true;
  } catch (e) {
    setMsg(e.message || "刪除失敗", true);
  }
};

loadKey();
</script>
</body>
</html>
